<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./assets/style/style.css">
</head>

<body>

  <header>
    <div class="wrap nav">
      <div class="brand"><span class="logo"></span> COLORADO AVALANCHE</div>

      <h2 class="reveal">Novinky z klubu</h2>

        <button class="chip news-chip" data-m="dec">December 2025</button>
        <button class="chip news-chip" data-m="nov">November 2025</button>
      </div>

      <div class="news-grid" id="news"></div>
    </div>
  </section>

  <script src="./assets/data/news/news-data.js"></script>
